<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Login | BlogHub</title>

<link rel="stylesheet"
href="../css/common.css">

<link rel="stylesheet"
href="../css/auth.css">

</head>

<body>

<div class="auth-container">

<div class="auth-left">

<h1>Welcome Back!</h1>

<p>
Login to continue writing
and reading amazing blogs.
</p>

</div>

<div class="auth-right">

<form id="loginForm">

<h2>Login</h2>

<input
type="email"
id="loginEmail"
placeholder="Email Address"
required>

<input
type="password"
id="loginPassword"
placeholder="Password"
required>

<button type="submit">
Login
</button>

<p>

Don't have an account?

<a href="../pages/register.html">
Register
</a>

</p>

</form>

</div>

</div>
<script src="../js/auth.js"></script>

</body>
</html>
